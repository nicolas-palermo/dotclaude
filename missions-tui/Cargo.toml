[package]
name = "missions-tui"
version = "0.1.0"
edition = "2021"
description = "Read-only ratatui mission control panel for the missions plugin"

[lib]
name = "missions_tui"
path = "src/lib.rs"

[[bin]]
name = "missions-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
